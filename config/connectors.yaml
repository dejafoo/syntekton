# Connector policy. Everything is off until an operator opts in here.
#
# A connector's manifest declares the ceiling: which tools exist, whether it may
# write, which hosts it may reach. This file can only narrow that ceiling. It can
# never add a tool, widen permissions, or grant egress a manifest did not declare.
#
# Enabling a connector still does not give any task access to it — the workflow
# pack must also request the matching tool class.

# Write-capable connectors are out of scope for Phase 4. Flipping this is a
# deliberate, reviewable change; read-only connectors do not need it.
allow_write_connectors: false

connectors:
  # Tavily web search (read-only). Needs TAVILY_API_KEY in the environment.
  tavily_web_search:
    enabled: false
    # Blunt egress narrowing. If you set this, include api.tavily.com or search
    # cannot reach the API at all. Prefer options.result_domains below.
    allowed_domains: []
    denied_domains: []
    max_timeout_seconds: 20
    options:
      max_results: 5
      max_chars_per_result: 4000
      search_depth: basic
      # Hosts whose pages may be quoted. Empty means any host Tavily returns;
      # listing hosts restricts citable sources without blocking the API itself.
      result_domains: []
      exclude_domains: []

  # Local filesystem over MCP (read-only). Roots must be listed explicitly;
  # there is no default root, so an unconfigured server simply cannot read.
  filesystem_mcp:
    enabled: false
    max_timeout_seconds: 30
    options:
      roots: []
      # Command used to start the server. `npx` resolves the pinned package.
      command: npx
      args:
        - "-y"
        - "@modelcontextprotocol/server-filesystem"
