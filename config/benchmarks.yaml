ablations:
  single_agent_baseline:
    runner: single_agent_baseline
  implementation_isolation:
    runner: agent_isolation
    isolation_capability: implementation
  orchestration_validation_repair:
    runner: full_orchestration
    disable_review: true
    disable_analysis: true
    planner_mode: fixed
  full_orchestration_no_review:
    runner: full_orchestration
    disable_review: true
  full_orchestration_with_review:
    runner: full_orchestration
    force_review: true
  orchestration_file_list_context:
    runner: full_orchestration
    disable_review: true
    context_mode: file_list_only
    planner_mode: fixed
  orchestration_targeted_context:
    runner: full_orchestration
    disable_review: true
    context_mode: targeted
    planner_mode: fixed
  orchestration_fixed_planner:
    runner: full_orchestration
    disable_review: true
    planner_mode: fixed
  orchestration_live_planner:
    runner: full_orchestration
    disable_review: true
    planner_mode: live
  orchestration_complexity_planner:
    runner: full_orchestration
    disable_review: true
    planner_mode: complexity_sensitive
  orchestration_with_skills:
    runner: full_orchestration
    disable_skills: false
  orchestration_no_skills:
    runner: full_orchestration
    disable_skills: true
  frontier_reference:
    runner: frontier_reference

controls:
  require_identical_worker_profile: true
  require_identical_temperature: true
  require_identical_case_budget: true
  pairwise_random_seed: 0
# LLM-judge benchmark defaults
default_judge: grok_judge
usable_threshold: 3
oracle_sampling_rate: 0.2
default_subjects:
  - full_orchestration
  - single_agent_baseline
  - agent_isolation
subjects:
  full_orchestration:
    model_profile: supervisor
    description: Multi-agent MVP orchestration
  single_agent_baseline:
    model_profile: supervisor
    description: Single agent without orchestration
  agent_isolation:
    model_profile: coding_worker
    isolation_capability: implementation
    description: Isolated capability runner
  orchestration_strong_worker:
    model_profile: local_target_reviewer
    description: Fixed planner with stronger implementation worker
  orchestration_with_skills:
    model_profile: supervisor
    description: Orchestration with skills enabled (skill scorecard arm)
  orchestration_no_skills:
    model_profile: supervisor
    description: Orchestration with skills disabled (ablation arm)
  frontier_reference:
    model_profile: frontier_oracle
    description: Frontier reference (oracle budget)
