allow_dirty_repo: false
max_artifact_bytes: 5000000
prohibited_path_globs:
  - ".env"
  - "**/.env"
  - "**/secrets/**"

# PM5.E / R5: remote ingress hardening. Forwarded headers are ignored unless
# trust_forwarded_headers is true AND the peer matches trusted_proxies.
ingress:
  trusted_proxies: []
  trust_forwarded_headers: false
  max_upload_bytes: 52428800
  allowed_upload_media_types:
    - application/x-git-bundle
    - application/octet-stream
  max_upload_filename_bytes: 255
  auth_failure_limit: 20
  auth_failure_window_seconds: 60
  submit_rate_limit: 30
  submit_window_seconds: 60
  upload_rate_limit: 10
  upload_window_seconds: 60

# Run / task budget defaults. Host `--budget-usd` only overrides cost; these
# ceilings apply unless a caller sets them explicitly on the RunRequest.
# Task clamps also bound planner-invented budgets so a live plan cannot starve
# tool loops (max_tool_calls: 5) or pack prompts past typical model windows.
budgets:
  run:
    max_input_tokens: 3000000
    max_output_tokens: 300000
    max_tool_calls: 250
    max_tasks: 20
    max_parallel_tasks: 3
    max_wall_clock_seconds: 1800
    max_command_seconds: 300
  task:
    max_input_tokens: 28000
    max_output_tokens: 8000
    max_tool_calls: 40
    min_tool_calls: 25
    max_input_tokens_cap: 48000
    max_repair_attempts: 2
    max_wall_clock_seconds: 600
    max_cost_usd: "1.00"

# Prompt packing for repository context. Excerpt/manifest sizes are also
# bounded by the task input-token budget, and optionally by the assigned
# model profile's context_soft_limit (config/models.yaml).
context:
  max_excerpt_files: 12
  min_excerpt_chars: 4000
  max_excerpt_chars: 20000
  max_file_list_paths: 80
  max_manifest_excerpts: 20
  min_manifest_chars: 2000
  max_manifest_chars: 40000
  clamp_to_model_window: true
  chars_per_token: 4
  # Leave this fraction of the model window for system/tools/output.
  model_window_reserve_ratio: 0.45

registered_commands:
  python_tests:
    executable: uv
    args:
      - run
      - pytest
    timeout_seconds: 300
  python_typecheck:
    executable: uv
    args:
      - run
      - basedpyright
      - src
    timeout_seconds: 180
