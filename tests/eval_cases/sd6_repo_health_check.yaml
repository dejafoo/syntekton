id: sd6_repo_health_check
workflow_type: code_change
corpus_category: repository_change
request: |
  Sanitized repository change: add a validated health-check function in a
  dedicated module, with unit tests. This repository is a plain Python package
  (not a web framework). Do not add HTTP routing. Expose a callable that returns
  a structured status payload (for example {"status": "ok"}).
repository: tests/fixtures/sample_api
tags: ['sd6', 'repository_change', 'coding', 'sanitized']
expected_status:
  - completed
  - awaiting_approval
acceptance_criteria:
  - src/app/health.py defines a callable health check returning status information
  - tests/test_health.py covers the health check
  - No HTTP server or route wiring is required for this fixture
expected_files:
  - src/app/health.py
  - tests/test_health.py
reference_hints: |
  Usable means a callable health module plus tests in the required paths.
isolation_targets:
  - implementation
smoke_commands:
  - python_tests
metadata:
  sd6_corpus: true
  sanitization: sample_api_fixture_no_customer_code
