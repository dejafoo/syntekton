    title: FHIR R4 Overview
    url: https://hl7.org/fhir/R4/index.html
    published_at: "2019-10-30"
    excerpt: >-
      FHIR is a standard for health care data exchange. Public documentation
      describes resource shapes and REST interactions; it is not a clinical
      or compliance verdict for any deployment.
