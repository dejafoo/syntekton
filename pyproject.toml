[project]
name = "product-factory"
version = "0.1.0"
description = "Multi-agent product factory MVP — typed task-graph orchestration"
authors = [
    { name = "Tero Lipponen", email = "tero.lipponen@dejafoo.com" }
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "typer>=0.16.0",
    "rich>=14.0.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.9.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.12.0",
    "basedpyright>=1.29.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    # Starlette TestClient prefers httpx2; keeps the suite free of
    # StarletteDeprecationWarning under the frozen lock.
    "httpx2>=2.0.0",
    # The optional OTLP bridge is guarded at runtime, but the type checker must
    # still resolve it — otherwise `reportMissingImports` fires on every run.
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
]
observability = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]
otel = [
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
]

[project.scripts]
product-factory = "product_factory.cli.app:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "SIM102", "E501"]

# G1 tip left unused imports in the compatibility façade after executor extraction.
# SD2 owns coordinator cleanup; SD5 quarantines lint so the expanded PR gate can stay green.
[tool.ruff.lint.per-file-ignores]
"src/product_factory/orchestration/coordinator.py" = ["E402", "F401", "I001"]

# Same G1 tip: long-line wraps only. Quarantined rather than rewriting SD1-owned modules.
[tool.ruff.format]
exclude = [
    "src/product_factory/api/control.py",
    "src/product_factory/executors/**",
    "src/product_factory/persistence/database.py",
    "src/product_factory/registry/capability_descriptors.py",
    "tests/contract/test_observability_api.py",
    "tests/graph/test_release_readiness_pack.py",
    "tests/unit/test_sd1_capability_descriptors.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
norecursedirs = ["fixtures", "eval_cases", ".*", "build", "dist"]
addopts = "--ignore=tests/fixtures --ignore=tests/eval_cases"
markers = [
    "integration: live OpenRouter/local-model tests (opt-in via PRODUCT_FACTORY_LIVE=1 or PRODUCT_FACTORY_LOCAL_LIVE=1)",
]

[tool.basedpyright]
include = ["src"]
# Mirror the ruff quarantine: unused-import noise in the façade is SD2 work.
exclude = ["**/orchestration/coordinator.py"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingImports = true
reportUnusedImport = true
